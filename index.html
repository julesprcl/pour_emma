<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Spéciale ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Fond dégradé doux et romantique */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(225, 112, 137, 0.25);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* BOÎTE HEURE */
        .time-box {
            background: #fff0f5;
            border: 2px dashed #ff85a2;
            padding: 15px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #d63384;
            margin-bottom: 25px;
        }

        .instruction {
            color: #495057;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        /* POINT GPS */
        .gps-coords {
            font-family: monospace;
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            color: #d63384;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border: 1px solid #f8d7da;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }
