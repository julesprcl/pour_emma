<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Emma ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Bouton Admin en haut à droite */
        .admin-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, background 0.2s;
        }

        .admin-toggle:hover {
            transform: rotate(45deg);
            background: #ffffff;
        }

        /* Panneau de configuration Admin */
        .admin-panel {
            display: none;
            position: absolute;
            top: 70px;
            right: 20px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 300px;
            z-index: 100;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h3 {
            font-size: 1rem;
            color: #d63384;
            margin-bottom: 12px;
        }

        .admin-panel label {
            font-size: 0.8rem;
            color: #6c757d;
            display: block;
            margin-top: 10px;
        }

        .admin-panel input {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .admin-panel button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .admin-panel button:hover {
            background: #26af5f;
        }

        .card {
            background: #ffffff;
            padding: 35px 25px;
