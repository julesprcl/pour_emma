<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Emma ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(225, 112, 137, 0.3);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .time-box {
            background: #fff0f5;
            border: 2px dashed #ff85a2;
            padding: 15px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #d63384;
            margin-bottom: 25px;
        }

        .instruction {
            color: #495057;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .gps-coords {
            font-family: monospace;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            color: #d63384;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border: 1px solid #f8d7da;
        }

        .btn-copy {
            background: #ff6b81;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-maps {
            display: block;
            width: 100%;
            padding: 12px;
            background: #70a1ff;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-icon"></div>
        <h1>Invitation Spéciale</h1>
        <p class="subtitle"></p>

        <div class="time-box">
            🕒 Rendez-vous à 20h30
        </div>

        <p class="instruction">
            Copie le point GPS ci-dessous et colle-le dans ton appli de navigation (Google Maps, Waze, Apple Maps) :
        </p>

        <div class="gps-coords" id="coords">45.9308, 6.1174</div>

        <button class="btn-copy" onclick="copyGPS()">📋 Copier le point GPS</button>

        <a id="maps-link" href="https://maps.google.com/?q=45.9308,6.1174" target="_blank" class="btn-maps">
            🗺️ Ouvrir dans Google Maps
        </a>
    </div>

    <script>
        function copyGPS() {
            const coordsText = document.getElementById('coords').innerText.trim();
            navigator.clipboard.writeText(coordsText).then(() => {
                alert('Point GPS copié ! Tu peux le coller dans ta carte.');
            });
        }
    </script>

</body>
</html>
