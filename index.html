<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendez-vous</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }

        .time-box {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 25px;
        }

        .instruction {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .gps-coords {
            font-family: monospace;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            color: #f43f5e;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border: 1px dashed #f43f5e;
        }

        .btn-copy {
            background: #f43f5e;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }

        .btn-copy:active {
            background: #e11d48;
        }

        .btn-maps {
            display: inline-block;
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="time-box">
            🕒 Rendez-vous à 20h30
        </div>

        <p class="instruction">
            Copie les coordonnées GPS ci-dessous et colle-les dans la barre de recherche de ta carte (Google Maps, Waze ou Apple Maps) :
        </p>
        
        <div class="gps-coords" id="coords">
            45.8992, 6.1294
        </div>

        <button class="btn-copy" onclick="copyGPS()">📋 Copier les coordonnées</button>

        <a id="maps-link" href="https://maps.google.com0" target="_blank" class="btn-maps">
            Ouvrir dans Google Maps
        </a>
    </div>

    <script>
        function copyGPS() {
            const coordsText = document.getElementById('coords').innerText.trim();
            navigator.clipboard.writeText(coordsText).then(() => {
                alert('Coordonnées copiées ! Colle-les dans ton GPS.');
            });
        }
    </script>

</body>
</html>
